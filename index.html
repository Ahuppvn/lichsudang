<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hệ Thống Thi Thử Lịch Sử Đảng - Chuẩn Moodle</title>
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: #131926;
            --bg-card-hover: #1b2438;
            --border: #232f48;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --correct: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.15);
            --wrong: #ef4444;
            --wrong-bg: rgba(239, 68, 68, 0.18);
            --gold: #fbbf24;
            --nav-border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-body); color: var(--text-main); line-height: 1.5; padding-bottom: 70px; }

        /* Header */
        header { background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 10px 16px; }
        .header-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .brand { font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        .brand span { color: var(--gold); }
        .timer-box { background: #1e293b; border: 1px solid var(--gold); color: var(--gold); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 800; display: none; }
        .head-actions { display: flex; gap: 6px; align-items: center; }
        .btn-head { background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-head.btn-import { background: rgba(251, 191, 36, 0.15); border-color: var(--gold); color: var(--gold); }

        .main-layout { max-width: 1200px; margin: 15px auto; padding: 0 12px; display: grid; grid-template-columns: 1fr 280px; gap: 18px; align-items: start; }
        @media (max-width: 880px) { .main-layout { grid-template-columns: 1fr; } }

        /* Bảng điều khiển */
        .mode-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 15px; }
        .mode-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .mode-btn { background: #0b0f19; border: 1px solid var(--border); color: var(--text-sub); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: bold; cursor: pointer; transition: 0.15s; }
        .mode-btn:hover, .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .mode-btn.exam { border-color: var(--gold); color: var(--gold); }
        .mode-btn.exam.active { background: var(--gold); color: #000; }

        .score-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
        .score-box { background: #090d16; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--border); }
        .score-num { font-size: 16px; font-weight: 900; }
        .score-sub { font-size: 10px; color: var(--text-sub); }

        /* Câu hỏi */
        .q-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; scroll-margin-top: 75px; transition: border-color 0.2s; }
        .q-card.done-ok { border-color: var(--correct); }
        .q-card.done-fail { border-color: var(--wrong); }
        .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .q-badge { background: #1e293b; color: var(--accent); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; }
        .q-trap-badge { background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.4); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; }
        .q-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

        .opt-list { display: flex; flex-direction: column; gap: 8px; }
        .opt-item { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; color: var(--text-main); font-size: 13.5px; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 8px; min-height: 46px; }
        .opt-char { background: #1e293b; border: 1px solid var(--border); border-radius: 4px; min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 1px; }

        .opt-item.is-correct { background: var(--correct-bg) !important; border-color: var(--correct) !important; color: #34d399 !important; font-weight: bold; }
        .opt-item.is-correct .opt-char { background: var(--correct); color: #000; }
        .opt-item.is-wrong { background: var(--wrong-bg) !important; border-color: var(--wrong) !important; color: #f87171 !important; }
        .opt-item.is-wrong .opt-char { background: var(--wrong); color: #fff; }
        .opt-item.hint-correct { border: 1px dashed var(--correct) !important; color: #34d399; }
        .opt-item.disabled { pointer-events: none; }

        /* Giải thích chỉ hiện khi SAI */
        .trap-explain { display: none; background: #261214; border-left: 4px solid var(--wrong); padding: 10px 12px; border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 13px; line-height: 1.5; color: #fecaca; }
        .trap-explain b { color: #f87171; display: block; margin-bottom: 2px; }

        /* LƯỚI MOODLE */
        .moodle-nav-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: sticky; top: 75px; max-height: calc(100vh - 90px); overflow-y: auto; }
        .nav-panel-title { font-size: 13px; font-weight: 800; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .moodle-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .grid-btn { aspect-ratio: 0.85; background: #090d16; border: 1.5px solid var(--nav-border); border-radius: 4px; color: var(--text-main); font-size: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; }
        .grid-btn.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
        .grid-btn.c-correct { border-color: var(--correct); background: var(--correct-bg); color: #34d399; }
        .grid-btn.c-wrong { border-color: var(--wrong); background: var(--wrong-bg); color: #f87171; }

        .mobile-nav-toggle { display: none; position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 30px; font-size: 13px; font-weight: 900; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); cursor: pointer; }
        @media (max-width: 880px) {
            .mobile-nav-toggle { display: block; }
            .moodle-nav-panel { display: none; position: fixed; bottom: 0; left: 0; right: 0; top: auto; max-height: 65vh; border-radius: 16px 16px 0 0; z-index: 1001; box-shadow: 0 -5px 25px rgba(0,0,0,0.9); }
            .moodle-nav-panel.show-mobile { display: block; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-wrap">
        <div class="brand">🎯 LỊCH SỬ ĐẢNG <span>MOODLE</span></div>
        <div class="timer-box" id="timer-box">⏱️ 40:00</div>
        <div class="head-actions">
            <!-- Nút chọn 3 file txt từ máy -->
            <input type="file" id="file-picker" multiple accept=".txt" style="display:none;" onchange="handleFileSelect(event)">
            <button class="btn-head btn-import" onclick="document.getElementById('file-picker').click()">📁 Nạp 3 File .txt</button>
            <button class="btn-head" onclick="shuffleQuestions()">🔀 Tráo đề</button>
            <button class="btn-head" onclick="resetAnswers()">Làm lại</button>
        </div>
    </div>
</header>

<div class="main-layout">
    <div>
        <div class="mode-card">
            <div style="font-size: 12px; font-weight: bold; color: var(--gold); margin-bottom: 8px;">CHỌN CHẾ ĐỘ THI & ÔN TẬP:</div>
            <div class="mode-row">
                <button class="mode-btn exam" onclick="startExam(50, 40, this)">🔥 Thi Thử 50 Câu (40p)</button>
                <button class="mode-btn exam" onclick="startExam(20, 15, this)">⚡ Thi Thử 20 Câu (15p)</button>
                <button class="mode-btn active" onclick="loadMode('ch1', this)" id="btn-ch1">Chương 1 (<span id="cnt-ch1">80</span>)</button>
                <button class="mode-btn" onclick="loadMode('ch2', this)" id="btn-ch2">Chương 2 (<span id="cnt-ch2">85</span>)</button>
                <button class="mode-btn" onclick="loadMode('ch3', this)" id="btn-ch3">Chương 3 (<span id="cnt-ch3">60</span>)</button>
                <button class="mode-btn" onclick="loadMode('traps', this)">⚠️ 16 Câu Bẫy</button>
                <button class="mode-btn" onclick="loadMode('all', this)">Tất Cả (<span id="cnt-all">225</span>)</button>
            </div>
            <div class="score-bar">
                <div class="score-box">
                    <div class="score-num" id="s-total" style="color: var(--accent);">0</div>
                    <div class="score-sub">TỔNG CÂU</div>
                </div>
                <div class="score-box">
                    <div class="score-num" id="s-done" style="color: #fff;">0</div>
                    <div class="score-sub">ĐÃ LÀM</div>
                </div>
                <div class="score-box">
                    <div class="score-num" id="s-correct" style="color: var(--correct);">0</div>
                    <div class="score-sub">ĐÚNG</div>
                </div>
                <div class="score-box">
                    <div class="score-num" id="s-point" style="color: var(--gold);">0.0</div>
                    <div class="score-sub">ĐIỂM /10</div>
                </div>
            </div>
        </div>

        <div id="questions-container"></div>
    </div>

    <!-- Bảng lưới Moodle -->
    <div class="moodle-nav-panel" id="nav-panel">
        <div class="nav-panel-title">
            <span>Bảng Câu Hỏi Moodle</span>
            <span onclick="toggleMobileNav()" style="cursor:pointer; display:none;" id="btn-close-nav">✕ Đóng</span>
        </div>
        <div class="moodle-grid" id="moodle-grid"></div>
    </div>
</div>

<button class="mobile-nav-toggle" onclick="toggleMobileNav()">📋 Bảng câu hỏi</button>

<script>
// BỘ NGÂN HÀNG CÂU HỎI MẶC ĐỊNH (Bao gồm các bẫy Moodle then chốt)
const CORE_INITIAL_BANK = [
    { id: "c1_4", ch: 1, num: 4, q: "Ban chấp hành Trung ương Đảng xác định chuẩn bị khởi nghĩa vũ trang là nhiệm vụ trung tâm tại Hội nghị nào?", opts: ["Hội nghị họp tháng 11 - 1940", "Hội nghị họp tháng 10 - 1930", "Hội nghị họp tháng 11 - 1939", "Hội nghị họp tháng 5 – 1941"], ans: 3, trap: "Hội nghị Trung ương 8 (5/1941) họp tại Pác Bó đã hoàn chỉnh chuyển hướng chỉ đạo chiến lược." },
    { id: "c1_27", ch: 1, num: 27, q: "Điều kiện nào tạo ra khả năng đấu tranh công khai hợp pháp cho phong trào cách mạng Đông Dương giai đoạn 1936 - 1939?", opts: ["Mặt trận nhân dân Pháp lên cầm quyền", "Tất cả các điều kiện trên", "Chủ trương chuyển hướng chiến lược cách mạng thế giới của Quốc tế Cộng sản", "Sự xuất hiện chủ nghĩa phát xít và nguy cơ chiến tranh thế giới"], ans: 0, trap: "⚠️ BẪY MOODLE: Không chọn 'Tất cả các điều kiện trên'. Hệ thống Moodle cài đặt đáp án đúng là: Mặt trận nhân dân Pháp lên cầm quyền." },
    { id: "c1_44", ch: 1, num: 44, q: "Khẩu hiệu nào sau được nêu ra trong Cao trào kháng Nhật cứu nước?", opts: ["Đánh đuổi phát xít Nhật - Pháp", "Đánh đuổi phát xít Nhật", "Giải quyết nạn đói", "Chống nhổ lúa trồng đay"], ans: 0, trap: "⚠️ BẪY MOODLE: Chọn 'Đánh đuổi phát xít Nhật' bị hệ thống chấm sai. Đáp án cài sẵn của trường là: Đánh đuổi phát xít Nhật - Pháp." },
    { id: "c1_66", ch: 1, num: 66, q: "Tổ chức An Nam Cộng sản Đảng được thành lập vào thời gian nào?", opts: ["Tháng 6 - 1927", "Tháng 6 - 1928", "Tháng 11 - 1929", "Tháng 7 – 1929"], ans: 2, trap: "⚠️ BẪY MOODLE: Không chọn tháng 7 – 1929. Đáp án chính xác được hệ thống chấp nhận là: Tháng 11 - 1929." },
    { id: "c2_24", ch: 2, num: 24, q: "Đầu năm 1948, TW Đảng đã đề ra cách thức thực hiện cách mạng ruộng đất theo đường lối riêng biệt của cách mạng Việt Nam, đó là:", opts: ["Sửa đổi chế độ ruộng đất trong phạm vi không có hại cho nông dân.", "Cải cách từng bước để dần dần thu hẹp phạm vi bóc lột của địa chủ", "Cải cách ruộng đất", "Cả ba phương án trên"], ans: 3, trap: "⚠️ BẪY MOODLE: Nhất định phải khoanh (d) 'Cả ba phương án trên' mới được Moodle tính điểm!" },
    { id: "c2_39", ch: 2, num: 39, q: "Hội nghị Ban thường vụ Trung Đảng họp mở rộng quyết định phát động cuộc kháng chiến toàn quốc họp vào thời gian nào?", opts: ["Ngày 18 - 12 - 1946", "Ngày 22 - 12 – 1946", "Ngày 19 - 12 - 1946", "Ngày 20 - 12 - 1946"], ans: 2, trap: "⚠️ BẪY MOODLE: Sinh viên rất hay nhầm ngày 18. Moodle chấm sai nếu chọn ngày 18. Đáp án chuẩn là: Ngày 19 - 12 - 1946." },
    { id: "c2_45", ch: 2, num: 45, q: "Kẻ thù chính của cách mạng Việt Nam ngay sau Cách mạng 8 - 1945?", opts: ["Tưởng Giới Thạch và tay sai", "Thực dân Anh xâm lược", "Giặc đói và giặc dốt.", "Thực dân Pháp xâm lược."], ans: 2, trap: "⚠️ BẪY MOODLE CỰC HIỂM: Theo phản xạ sinh viên sẽ chọn Pháp, nhưng đáp án cài đặt của trường là: Giặc đói và giặc dốt." },
    { id: "c2_69", ch: 2, num: 69, q: "Sau bản Hiệp định sơ bộ, ngày 14 - 9 Chủ tịch Hồ Chí Minh đã thay mặt Chính phủ ký bản Tạm ước với Chính phủ Pháp với nội dung:", opts: ["Chấm dứt chiến tranh ở Việt Nam.", "Pháp thừa nhận các quyền dân tộc cơ bản của nước Việt Nam", "Đình chỉ xung đột ở miền Nam và sẽ tiếp tục đàm phán vào 1 - 1947", "Các nội dung đều đúng"], ans: 3, trap: "⚠️ BẪY MOODLE: Chọn (c) sẽ bị báo sai. Phải chọn: (d) Các nội dung đều đúng." },
    { id: "c2_76", ch: 2, num: 76, q: "Tại sao Đảng lại lựa chọn giải pháp thương lượng với Pháp", opts: ["Cả ba đáp án trên", "Phối hợp với Pháp tấn công Tưởng.", "Chấm dứt cuộc kháng chiến ở Nam Bộ", "Buộc quân Tưởng phải rút ngay về nước..."], ans: 0, trap: "⚠️ BẪY MOODLE: Ngân hàng đề của trường cài đặt đáp án đúng là: (a) Cả ba đáp án trên." },
    { id: "c3_3", ch: 3, num: 3, q: "“Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc... phấn đấu sớm đưa nước ta cơ bản thành nước công nghiệp theo hướng hiện đại” là chủ đề của Đại hội nào?", opts: ["Đại hội XIII", "Đại hội XI", "Đại hội XII", "Đại hội X"], ans: 2, trap: "⚠️ BẪY MOODLE: Cụm từ 'cơ bản thành nước công nghiệp theo hướng hiện đại' là chủ đề của: ĐẠI HỘI XII." },
    { id: "c3_14", ch: 3, num: 14, q: "Chủ trương tổ chức cuộc vận động học tập và làm theo tấm gương đạo đức Hồ Chí Minh được đảng ta đề ra vào thời gian nào?", opts: ["Tháng 11 – 2008", "Tháng 11 – 2006", "Tháng 10 – 2008", "Tháng 10 – 2006"], ans: 1, trap: "⚠️ BẪY MOODLE: Dễ nhầm tháng 10. Chỉ thị 06 ban hành ngày 7/11/2006 nên đáp án chuẩn là: Tháng 11 – 2006." },
    { id: "c3_16", ch: 3, num: 16, q: "Cương lĩnh năm 1991 đã xác định mô hình xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng có mấy đặc trưng?", opts: ["5", "7", "8", "6"], ans: 2, trap: "⚠️ BẪY MOODLE: Giáo trình chuẩn có 6, nhưng đề Moodle cài đặt đáp án đúng là 8. Bắt buộc chọn 8 để có điểm!" },
    { id: "c3_19", ch: 3, num: 19, q: "Cương lĩnh năm 2011 xác định mục tiêu tổng quát khi kết thúc thời kỳ quá độ ở nước ta là gì?", opts: ["Cả ba đáp án trên", "Đến giữa thế kỷ XXI...", "Xây dựng được về cơ bản nền tảng kinh tế...", "Tạo cơ sở để nước ta trở thành nước XHCN..."], ans: 0, trap: "⚠️ BẪY MOODLE: Đáp án bao quát được hệ thống ghi nhận là: (a) Cả ba đáp án trên." },
    { id: "c3_27", ch: 3, num: 27, q: "Đại hội nào được đánh giá là đại hội mang tính bước ngoặt của Đảng, đưa đất nước sang thời kỳ mới đẩy mạnh công nghiệp hóa, hiện đại hóa?", opts: ["Đại hội IX", "Đại hội VI", "Đại hội VIII", "Đại hội VII"], ans: 3, trap: "⚠️ BẪY MOODLE: Hệ thống coi đại hội mang tính bước ngoặt đưa đất nước sang thời kỳ mới là: Đại hội VII (1991)." },
    { id: "c3_28", ch: 3, num: 28, q: "Đại hội VI đã đề ra mấy phương hướng lớn nhằm phát triển kinh tế - xã hội đất nước?", opts: ["5", "7", "6", "4"], ans: 2, trap: "⚠️ BẪY MOODLE: Nhớ chính xác số lượng phương hướng lớn của Đại hội VI là: 6." },
    { id: "c3_41", ch: 3, num: 41, q: "Hội nghị hiệp thương chính trị giữa đoàn đại biểu miền Bắc và đoàn đại biểu miền Nam đã họp ở đâu?", opts: ["Đà Nẵng", "Hà Nội", "Huế", "Sài Gòn"], ans: 3, trap: "⚠️ BẪY MOODLE: Hội nghị hiệp thương chính trị thống nhất hai miền (11/1975) họp tại Sài Gòn." },
    { id: "c3_60", ch: 3, num: 60, q: "Việt Nam chính thức được kết nạp là thành viên thứ 150 của WTO vào thời gian nào?", opts: ["Tháng 12 – 2005", "Tháng 11 – 2005", "Tháng 12 – 2006", "Tháng 11 – 2006"], ans: 3, trap: "⚠️ BẪY MOODLE: Lễ kết nạp diễn ra vào Tháng 11 – 2006 (ngày 7/11/2006)." }
];

let globalBank = JSON.parse(localStorage.getItem('LSD_GLOBAL_BANK') || JSON.stringify(CORE_INITIAL_BANK));
let currentMode = 'ch1';
let activeQuestions = [];
let userState = {}; 
let timerInterval = null;
let timeLeft = 0;

// BỘ PHÂN TÍCH FILE TEXT CỰC MẠNH
function parseTextToQuestions(text, defaultCh) {
    let ch = defaultCh;
    if (/chương\s*1/i.test(text)) ch = 1;
    else if (/chương\s*2/i.test(text)) ch = 2;
    else if (/chương\s*3/i.test(text)) ch = 3;

    const rawBlocks = text.split(/🔴\s*(?:\*\*)?Câu hỏi\s*(\d+)[\*:]*/i);
    const parsed = [];

    for (let i = 1; i < rawBlocks.length; i += 2) {
        const num = parseInt(rawBlocks[i]);
        const content = rawBlocks[i + 1];
        if (!content) continue;

        const lines = content.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length < 5) continue;

        const qTitle = lines[0].replace(/^[:\*\s]+/, '').replace(/[\*]+$/, '').trim();
        const opts = [];
        let ans = -1;
        let trap = '';

        for (let j = 1; j < lines.length; j++) {
            const line = lines[j];
            const optMatch = line.match(/^([a-d])[\.\)]\s*(.*)/i);
            if (optMatch) {
                let optText = optMatch[2].trim();
                if (optText.includes('🟢')) {
                    ans = opts.length;
                    optText = optText.replace(/🟢/g, '').trim();
                }
                opts.push(optText);
            } else if (line.includes('⚠️') || /lưu ý bẫy moodle/i.test(line)) {
                trap = line.replace(/^[⚠️\*\s]+/, '').replace(/^Lưu ý bẫy Moodle[:\s\*\-]*/i, '').replace(/[\*]+$/, '').trim();
            } else if (trap && line.length > 0 && !line.startsWith('🔴')) {
                trap += ' ' + line.replace(/[\*]+$/, '').trim();
            }
        }

        if (opts.length >= 2 && ans !== -1) {
            parsed.push({
                id: `c${ch}_${num}`,
                num: num,
                ch: ch,
                q: qTitle,
                opts: opts,
                ans: ans,
                trap: trap
            });
        }
    }
    return parsed;
}

// Xử lý nạp 3 file từ máy tính/điện thoại
async function handleFileSelect(evt) {
    const files = evt.target.files;
    if (!files || files.length === 0) return;

    let totalAdded = 0;
    for (let f of files) {
        const text = await f.text();
        const parsed = parseTextToQuestions(text, 1);
        
        parsed.forEach(q => {
            const existingIdx = globalBank.findIndex(item => item.id === q.id);
            if (existingIdx >= 0) {
                globalBank[existingIdx] = q;
            } else {
                globalBank.push(q);
            }
            totalAdded++;
        });
    }

    localStorage.setItem('LSD_GLOBAL_BANK', JSON.stringify(globalBank));
    updateCounters();
    alert(`🎉 Đã nạp thành công dữ liệu từ ${files.length} file! Hiện tại hệ thống có ${globalBank.length} câu hỏi.`);
    loadMode(currentMode);
}

// Tự động tải file từ cùng kho GitHub (nếu bạn đã kéo thả file txt lên)
async function autoFetchFromRepo() {
    const targets = [
        { url: 'chương 1.txt', ch: 1 }, { url: 'ch1.txt', ch: 1 },
        { url: 'chương 2.txt', ch: 2 }, { url: 'ch2.txt', ch: 2 },
        { url: 'Chương 3.txt', ch: 3 }, { url: 'ch3.txt', ch: 3 }
    ];

    let updated = false;
    for (let t of targets) {
        try {
            const res = await fetch(encodeURI(t.url));
            if (res.ok) {
                const text = await res.text();
                const parsed = parseTextToQuestions(text, t.ch);
                if (parsed.length > 0) {
                    parsed.forEach(q => {
                        const idx = globalBank.findIndex(item => item.id === q.id);
                        if (idx >= 0) globalBank[idx] = q;
                        else globalBank.push(q);
                    });
                    updated = true;
                }
            }
        } catch(e) {}
    }

    if (updated) {
        localStorage.setItem('LSD_GLOBAL_BANK', JSON.stringify(globalBank));
        updateCounters();
        loadMode(currentMode);
    }
}

function updateCounters() {
    document.getElementById('cnt-all').innerText = globalBank.length;
    document.getElementById('cnt-ch1').innerText = globalBank.filter(q => q.ch === 1).length;
    document.getElementById('cnt-ch2').innerText = globalBank.filter(q => q.ch === 2).length;
    document.getElementById('cnt-ch3').innerText = globalBank.filter(q => q.ch === 3).length;
}

function loadMode(mode, btnEl) {
    currentMode = mode;
    stopTimer();
    document.getElementById('timer-box').style.display = 'none';

    if (btnEl) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
    }

    if (mode === 'ch1') activeQuestions = globalBank.filter(q => q.ch === 1).sort((a,b) => a.num - b.num);
    else if (mode === 'ch2') activeQuestions = globalBank.filter(q => q.ch === 2).sort((a,b) => a.num - b.num);
    else if (mode === 'ch3') activeQuestions = globalBank.filter(q => q.ch === 3).sort((a,b) => a.num - b.num);
    else if (mode === 'traps') activeQuestions = globalBank.filter(q => q.trap && (q.trap.includes('BẪY') || q.trap.includes('Moodle')));
    else if (mode === 'all') activeQuestions = [...globalBank];

    userState = {};
    renderAll();
}

function startExam(count, minutes, btnEl) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');

    // Trộn ngẫu nhiên câu hỏi từ TOÀN BỘ ngân hàng để thi
    const shuffled = [...globalBank].sort(() => Math.random() - 0.5);
    activeQuestions = shuffled.slice(0, Math.min(count, shuffled.length));
    userState = {};

    timeLeft = minutes * 60;
    const tBox = document.getElementById('timer-box');
    tBox.style.display = 'inline-block';
    updateTimerDisplay();

    stopTimer();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
            stopTimer();
            alert('HẾT GIỜ LÀM BÀI! Hãy kiểm tra điểm số của bạn trên bảng điều khiển.');
        }
    }, 1000);

    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timer-box').innerText = `⏱️ ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function renderAll() {
    renderQuestions();
    renderMoodleGrid();
    updateDashboard();
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    if (activeQuestions.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-sub);">Chưa có câu hỏi nào. Hãy bấm nút <b>"📁 Nạp 3 File .txt"</b> ở trên để đưa câu hỏi vào!</div>`;
        return;
    }

    activeQuestions.forEach((q, idx) => {
        const isDone = userState.hasOwnProperty(q.id);
        const card = document.createElement('div');
        card.className = `q-card ${isDone ? (userState[q.id].isCorrect ? 'done-ok' : 'done-fail') : ''}`;
        card.id = `question-${idx + 1}`;

        let optsHtml = '';
        q.opts.forEach((optText, oIdx) => {
            let cls = 'opt-item';
            if (isDone) {
                cls += ' disabled';
                if (oIdx === q.ans) cls += (userState[q.id].isCorrect ? ' is-correct' : ' hint-correct');
                else if (oIdx === userState[q.id].selected && !userState[q.id].isCorrect) cls += ' is-wrong';
            }
            optsHtml += `
                <button class="${cls}" onclick="handleAnswer('${q.id}', ${oIdx}, ${idx})">
                    <span class="opt-char">${letters[oIdx]}</span>
                    <span>${optText}</span>
                </button>
            `;
        });

        // ĐÚNG: Ẩn hoàn toàn. SAI: Bật ngay khung đỏ giải thích & bẫy!
        const showExplain = isDone && !userState[q.id].isCorrect;
        card.innerHTML = `
            <div class="q-head">
                <span class="q-badge">Câu ${idx + 1} • Chương ${q.ch || 1}</span>
                ${q.trap ? '<span class="q-trap-badge">⚠️ Bẫy Moodle</span>' : ''}
            </div>
            <div class="q-title">${q.q}</div>
            <div class="opt-list">${optsHtml}</div>
            <div class="trap-explain" id="explain-${q.id}" style="${showExplain ? 'display:block;' : ''}">
                <b>⚠️ TẠI SAO SAI & CẢNH BÁO BẪY:</b>
                ${q.trap || `Đáp án chính xác là: ${letters[q.ans]}.${q.opts[q.ans]}`}
            </div>
        `;
        container.appendChild(card);
    });
}

function renderMoodleGrid() {
    const grid = document.getElementById('moodle-grid');
    grid.innerHTML = '';

    activeQuestions.forEach((q, idx) => {
        const btn = document.createElement('div');
        btn.className = 'grid-btn';
        btn.id = `nav-item-${idx + 1}`;
        btn.innerText = idx + 1;

        if (userState[q.id]) {
            btn.classList.add(userState[q.id].isCorrect ? 'c-correct' : 'c-wrong');
        }

        btn.onclick = () => {
            document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const el = document.getElementById(`question-${idx + 1}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (window.innerWidth <= 880) toggleMobileNav();
        };

        grid.appendChild(btn);
    });
}

function handleAnswer(qId, selectedIdx, questionIdx) {
    if (userState[qId]) return;

    const q = activeQuestions.find(item => item.id == qId);
    if (!q) return;

    const isCorrect = (selectedIdx === q.ans);
    userState[qId] = { selected: selectedIdx, isCorrect: isCorrect };

    const card = document.getElementById(`question-${questionIdx + 1}`);
    if (card) {
        card.className = `q-card ${isCorrect ? 'done-ok' : 'done-fail'}`;
        const btns = card.querySelectorAll('.opt-item');
        btns.forEach((b, idx) => {
            b.classList.add('disabled');
            if (idx === q.ans) b.className = `opt-item disabled ${isCorrect ? 'is-correct' : 'hint-correct'}`;
            else if (idx === selectedIdx && !isCorrect) b.className = 'opt-item disabled is-wrong';
        });

        // Chỉ hiện giải thích khi làm SAI
        const exp = document.getElementById(`explain-${qId}`);
        if (exp) exp.style.display = isCorrect ? 'none' : 'block';
    }

    const gridBtn = document.getElementById(`nav-item-${questionIdx + 1}`);
    if (gridBtn) {
        gridBtn.classList.remove('c-correct', 'c-wrong');
        gridBtn.classList.add(isCorrect ? 'c-correct' : 'c-wrong');
    }

    updateDashboard();
}

function updateDashboard() {
    const total = activeQuestions.length;
    const answeredKeys = Object.keys(userState);
    const done = answeredKeys.length;
    let correct = 0;

    answeredKeys.forEach(k => {
        if (userState[k] && userState[k].isCorrect) correct++;
    });

    const point = total > 0 ? ((correct / total) * 10).toFixed(1) : '0.0';
    document.getElementById('s-total').innerText = total;
    document.getElementById('s-done').innerText = done;
    document.getElementById('s-correct').innerText = correct;
    document.getElementById('s-point').innerText = point;
}

function shuffleQuestions() {
    activeQuestions.sort(() => Math.random() - 0.5);
    userState = {};
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetAnswers() {
    if (confirm('Làm lại danh sách câu hỏi này từ đầu?')) {
        userState = {};
        renderAll();
    }
}

function toggleMobileNav() {
    const p = document.getElementById('nav-panel');
    p.classList.toggle('show-mobile');
    document.getElementById('btn-close-nav').style.display = p.classList.contains('show-mobile') ? 'inline' : 'none';
}

// Khởi chạy khi nạp trang
updateCounters();
loadMode('ch1');
autoFetchFromRepo();
</script>
